# Supply-chain: require packages to be at least 7 days old before installing.
# This complements Renovate's minimumReleaseAge (7 days) as a second gate —
# even if Renovate creates a PR early (known grouped-update bug), pnpm will
# reject packages that haven't aged sufficiently in CI.
minimumReleaseAge: 10080

# pnpm v11 requires an explicit build-script policy for dependencies that ship
# lifecycle scripts (ERR_PNPM_IGNORED_BUILDS otherwise). These native deps are
# pulled transitively (mainly via @servicenow/sdk) and were never built under
# pnpm v10, so we keep them denied — no build scripts run at install time.
# Flip a value to `true` only after reviewing that package's build script.
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  esbuild: false
  libxmljs2: false
minimumReleaseAgeExclude:
  # Renovate security update: pnpm@11.18.0 || 11.20.0
  - pnpm@11.18.0 || 11.20.0
  # Renovate security update: oxfmt@0.62.0
  - oxfmt@0.62.0
  # Renovate security update: oxlint@1.77.0
  - oxlint@1.77.0
