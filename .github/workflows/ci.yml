name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    uses: h13/.github/.github/workflows/ci-node.yml@main
    with:
      node-version: '22'

  frozen-keys:
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify keys.ts is up to date
        run: npx @servicenow/sdk build --frozenKeys
