name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.repository.is_template != true
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: npx @servicenow/sdk build

      - name: Install to instance
        env:
          SN_SDK_NODE_ENV: SN_SDK_CI_INSTALL
          SN_SDK_AUTH_TYPE: basic
          SN_SDK_USER: ${{ secrets.SN_SDK_USER }}
          SN_SDK_USER_PWD: ${{ secrets.SN_SDK_USER_PWD }}
          SN_SDK_INSTANCE_URL: ${{ secrets.SN_SDK_INSTANCE_URL }}
        run: npx @servicenow/sdk install
