name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.repository.is_template != true
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Install to instance
        env:
          SN_SDK_NODE_ENV: SN_SDK_CI_INSTALL
          # Set the SN_SDK_AUTH_TYPE environment *variable* to `oauth` on the
          # `dev` environment to switch to OAuth client_credentials (see README).
          SN_SDK_AUTH_TYPE: ${{ vars.SN_SDK_AUTH_TYPE || 'basic' }}
          SN_SDK_INSTANCE_URL: ${{ secrets.SN_SDK_INSTANCE_URL }}
          SN_SDK_USER: ${{ secrets.SN_SDK_USER }}
          SN_SDK_USER_PWD: ${{ secrets.SN_SDK_USER_PWD }}
          SN_SDK_OAUTH_CLIENT_ID: ${{ secrets.SN_SDK_OAUTH_CLIENT_ID }}
          SN_SDK_OAUTH_CLIENT_SECRET: ${{ secrets.SN_SDK_OAUTH_CLIENT_SECRET }}
        run: pnpm run install:instance
