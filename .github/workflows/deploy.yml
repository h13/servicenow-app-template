name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.repository.is_template != true
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # SN_SDK_AUTH_TYPE (basic/oauth) is not used: both POST /angular.do to
      # obtain a UI session, which fails with 401 for web_service_access_only
      # deploy users. Instead, fetch an OAuth client_credentials token directly
      # and hand it to the SDK via SN_SDK_SESSION_BEARER_TOKEN, which skips the
      # login flow entirely (see README "Configure CI/CD secrets").
      - name: Install to instance
        env:
          INSTANCE_URL: ${{ vars.SN_SDK_INSTANCE_URL }}
          CLIENT_ID: ${{ vars.SN_SDK_OAUTH_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.SN_SDK_OAUTH_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          INSTANCE="${INSTANCE_URL%/}"

          body=$(jq -rn '
            "grant_type=client_credentials"
            + "&client_id=" + (env.CLIENT_ID | @uri)
            + "&client_secret=" + (env.CLIENT_SECRET | @uri)
          ')

          response=$(printf '%s' "$body" | curl -sS \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data @- "$INSTANCE/oauth_token.do")

          token=$(printf '%s' "$response" | jq -r '.access_token // empty')
          if [ -z "$token" ]; then
            echo 'failed to get an access token:'
            printf '%s' "$response" | jq -r '{error, error_description}' \
              || printf '%s\n' "$response"
            exit 1
          fi
          echo "::add-mask::$token"

          SN_SDK_INSTANCE_URL="$INSTANCE" SN_SDK_SESSION_BEARER_TOKEN="$token" \
            pnpm run install:instance
